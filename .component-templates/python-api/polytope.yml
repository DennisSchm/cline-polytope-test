modules:
  - id: {{ project-name }}
    module: polytope/python
    params:
      - id: cmd
        info: The command to run
        type: [default, str, ./bin/run] # default to the run script
      - id: dev-mode
        info: Whether to run in dev mode (with hot reload, debugging)
        type: [default, bool, true]
      - id: port
        info: The port the API will run on
        type: [default, int, 3000] # default port for the API
    args:
      id: {{ project-name }}
      image: astral/uv:python3.12-bookworm-slim
      code: { type: host, path: {{ path }} }
      cmd: ./bin/run
      restart:
        policy: always
      services:
        - { id: {{ project-name }}, ports: [{protocol: http, port: pt.param port, expose-as: pt.param port}] }
      env:
        - { name: HTTP_PORT, value: pt.param port }
        - { name: LOG_LEVEL, value: INFO }
        - { name: HTTP_DEBUG, value: pt.param dev-mode" }
        - { name: HTTP_AUTORELOAD, value: pt.param dev-mode" }
      mounts:
        - { path: /root/.cache/, source: { type: volume, scope: project, id: {{ project-name | kebab_case}}-dependency-cache } }
  - id: {{ project-name }}-add
    module: {{ project-name }}
    params:
      - id: packages
        info: comma/whitespace-separated list of python packages to add to pyproject.toml
        type: str
    args:
      cmd: '#pt-js "uv add " + params.packages.replace(/[\s,]+/g, " ")'
